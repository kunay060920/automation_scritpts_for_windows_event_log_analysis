# Credential Access (TA0006), Lateral Movement (TA0008), Defense Evasion (TA0005)
---
id: credaccess_brute_force
title: Repeated failed logons against one account
description: >
  Multiple authentication failures for a single account from a single source
  within a short window. This is a correlation rule - no individual 4625 is
  interesting, and the signal exists only in the aggregate.
severity: high
author: Yaswanth
techniques: [T1110.001]
tags: [credential_access, correlation]
references:
  - https://attack.mitre.org/techniques/T1110/001/
false_positives:
  - A user with a stale cached password, often after a password change
  - Service accounts with expired credentials in scheduled tasks
detection:
  selection:
    event_id: 4625
  condition: selection
correlation:
  type: event_count
  group_by: [target_user_name, src_ip]
  timespan: 5m
  condition:
    gte: 5

---
id: credaccess_password_spray
title: Failed logons against many accounts from one source
description: >
  One source address failing authentication against several distinct accounts.
  Spraying is deliberately shaped to stay under per-account lockout thresholds,
  so it is invisible to the brute-force rule above - counting distinct users
  rather than total failures is what separates the two.
severity: critical
author: Yaswanth
techniques: [T1110.003]
tags: [credential_access, correlation]
false_positives:
  - A misconfigured server or terminal with several stale stored credentials
detection:
  selection:
    event_id: 4625
  condition: selection
correlation:
  type: value_count
  field: target_user_name
  group_by: [src_ip]
  timespan: 15m
  condition:
    gte: 5

---
id: credaccess_lsass_access
title: LSASS memory accessed by an unusual process
description: >
  A process opened a handle to lsass.exe. LSASS holds cached credential
  material, and reading its memory is the mechanism behind Mimikatz and
  comparable tooling. Access masks granting read are the ones that matter.
severity: critical
author: Yaswanth
techniques: [T1003.001]
tags: [credential_access]
references:
  - https://attack.mitre.org/techniques/T1003/001/
false_positives:
  - Endpoint protection products and legitimate debuggers open LSASS routinely
detection:
  selection:
    category: process_access
    target_process_name|endswith: lsass.exe
  filter_known_good:
    process_name|endswith:
      - MsMpEng.exe
      - taskmgr.exe
      - wmiprvse.exe
      - csrss.exe
      - services.exe
  condition: selection and not filter_known_good

---
id: lateral_remote_interactive_logon
title: Remote interactive logon
description: >
  A successful RDP (LogonType 10) or network logon to an administrative
  session. Machine accounts are excluded because they generate high volumes of
  benign type-3 activity that would otherwise drown the signal.
severity: medium
author: Yaswanth
techniques: [T1021.001]
tags: [lateral_movement]
false_positives:
  - Legitimate remote administration and helpdesk sessions
detection:
  selection:
    event_id: 4624
    logon_type: 10
  filter_machine:
    is_machine_account: 1
  condition: selection and not filter_machine

---
id: lateral_admin_share_access
title: Administrative share accessed remotely
description: >
  Access to ADMIN$, C$ or IPC$ from a remote source. These hidden shares are
  the transport used by PsExec, WMIC and similar remote execution tooling,
  making their use a reliable lateral movement indicator on workstations.
severity: high
author: Yaswanth
techniques: [T1021.002]
tags: [lateral_movement]
false_positives:
  - Backup software and centralised management platforms
  - Routine administrative file copies
detection:
  selection:
    category: share_access
    share_name|contains: ['ADMIN$', 'C$']
  filter_local:
    src_ip: ['127.0.0.1', '::1', '-']
  condition: selection and not filter_local

---
id: evasion_event_log_cleared
title: Event log cleared
description: >
  The Security or System log was cleared (1102 / 104). This is rarely
  legitimate on a running system and destroys the very evidence this pipeline
  depends on, so it is treated as critical regardless of context.
severity: critical
author: Yaswanth
techniques: [T1070.001]
tags: [defense_evasion, anti_forensics]
references:
  - https://attack.mitre.org/techniques/T1070/001/
false_positives:
  - Deliberate log rotation during system maintenance or imaging
detection:
  selection:
    category: log_cleared
  condition: selection

---
id: evasion_defender_disabled_or_alerting
title: Windows Defender detection or tampering
description: >
  Defender reported a malware detection or a configuration change. A detection
  event is evidence that something malicious reached the host; the surrounding
  events are useful for reconstructing what the operator did next.
severity: high
author: Yaswanth
techniques: [T1562.001]
tags: [defense_evasion]
false_positives:
  - EICAR test files and deliberate lab detonations
detection:
  selection:
    category: av_detection
  condition: selection

---
id: evasion_executable_from_temp
title: Executable launched from a temporary directory
description: >
  A process image located in Temp, AppData or Downloads. Attackers stage
  payloads in user-writable directories because they cannot write to Program
  Files without elevation. Installers do this legitimately, so this rule is
  most useful in combination with others rather than alone.
severity: medium
author: Yaswanth
techniques: [T1204.002, T1036]
tags: [execution, defense_evasion]
false_positives:
  - Software installers and self-extracting archives, which is common
  - Browser-based updaters
detection:
  selection:
    category: process_creation
    process_path|contains:
      - \AppData\Local\Temp\
      - \Windows\Temp\
      - \Users\Public\
      - \Downloads\
  condition: selection

---
id: discovery_reconnaissance_burst
title: Rapid host and domain discovery
description: >
  Several distinct discovery utilities executed in quick succession. Any one
  of these is unremarkable in isolation - administrators run whoami and
  ipconfig constantly - but a burst of distinct tools within minutes matches
  the reconnaissance phase that follows initial access.
severity: medium
author: Yaswanth
techniques: [T1082, T1033, T1016, T1087]
tags: [discovery, correlation]
false_positives:
  - Administrator troubleshooting sessions
  - Inventory and asset management scripts
detection:
  selection:
    category: process_creation
    process_name|endswith:
      - whoami.exe
      - systeminfo.exe
      - ipconfig.exe
      - net.exe
      - net1.exe
      - nltest.exe
      - quser.exe
      - tasklist.exe
      - arp.exe
      - route.exe
      - nbtstat.exe
  condition: selection
correlation:
  type: value_count
  field: process_name
  group_by: [computer]
  timespan: 10m
  condition:
    gte: 4
